[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "__project_name__"
version = "0.1.0"
description = ""
__license_metadata__
readme = "README.md"
requires-python = "==__python_version__.*"
keywords = []
classifiers = [
  "Programming Language :: Python :: __python_minor__",
  "Typing :: Typed",
]
dependencies = []__author_metadata__

[project.scripts]
__project_name__ = "__package_name__.main:main"

[dependency-groups]
dev = ["pre-commit", "pyright[nodejs]", "pytest>=9.0", "ruff", "taplo"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "__ruff_target__"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins: prevent shadowing builtins.
  "ANN",   # flake8-annotations: require explicit type annotations.
  "ARG",   # flake8-unused-arguments: catch unused function arguments.
  "ASYNC", # flake8-async: catch async and cancellation footguns.
  "B",     # flake8-bugbear: catch likely bugs and design issues.
  "BLE",   # flake8-blind-except: prevent overly broad exception handling.
  "C4",    # flake8-comprehensions: simplify comprehensions.
  "COM",   # flake8-commas: enforce consistent trailing commas.
  "DTZ",   # flake8-datetimez: require timezone-aware datetimes.
  "E",     # pycodestyle errors: core style errors.
  "EM",    # flake8-errmsg: keep exception messages explicit.
  "ERA",   # eradicate: flag commented-out code.
  "EXE",   # flake8-executable: validate executable file conventions.
  "F",     # Pyflakes: catch undefined names and unused imports.
  "FA",    # flake8-future-annotations: modernize annotation imports.
  "FBT",   # flake8-boolean-trap: discourage positional booleans.
  "FIX",   # flake8-fixme: track FIXME/TODO-style comments.
  "FLY",   # flynt: prefer f-strings where appropriate.
  "FURB",  # refurb: modernize and simplify Python code.
  "I",     # isort: sort imports.
  "ICN",   # flake8-import-conventions: enforce import aliases.
  "INP",   # flake8-no-pep420: require package __init__.py files.
  "ISC",   # flake8-implicit-str-concat: catch implicit string joins.
  "LOG",   # flake8-logging: catch logging API misuse.
  "N",     # pep8-naming: enforce Python naming conventions.
  "PERF",  # Perflint: catch avoidable performance issues.
  "PGH",   # pygrep-hooks: catch blanket lint suppressions.
  "PIE",   # flake8-pie: miscellaneous cleanups.
  "PL",    # Pylint: broad correctness and maintainability rules.
  "PT",    # flake8-pytest-style: enforce pytest idioms.
  "PTH",   # flake8-use-pathlib: prefer pathlib over os.path.
  "PYI",   # flake8-pyi: keep typing stubs consistent.
  "Q",     # flake8-quotes: enforce quote consistency.
  "RET",   # flake8-return: simplify return paths.
  "RSE",   # flake8-raise: improve raise statements.
  "RUF",   # Ruff-specific rules: extra Ruff-native checks.
  "S",     # flake8-bandit: catch common security issues.
  "SIM",   # flake8-simplify: simplify control flow.
  "SLF",   # flake8-self: discourage private member access.
  "T10",   # flake8-debugger: prevent committed breakpoints.
  "T20",   # flake8-print: prevent committed print debugging.
  "TC",    # flake8-type-checking: optimize type-only imports.
  "TD",    # flake8-todos: require actionable TODOs.
  "TRY",   # tryceratops: improve exception handling.
  "UP",    # pyupgrade: modernize syntax for the selected Python version.
  "W",     # pycodestyle warnings: core style warnings.
  "YTT",   # flake8-2020: catch sys.version misuse.
]
ignore = [
  "COM812", # Conflicts with Ruff's formatter.
  "ISC001", # Conflicts with Ruff's formatter.
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = false
suppress-none-returning = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["__package_name__"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["INP001", "PLR2004", "S101"]

[tool.pyright]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
]
include = ["src", "tests"]
pythonVersion = "__python_minor__"
reportMissingTypeStubs = "error"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
venv = ".venv"
venvPath = "."

[tool.pytest]
addopts = ["-ra"]
minversion = "9.0"
pythonpath = ["src"]
strict = true
testpaths = ["tests"]
