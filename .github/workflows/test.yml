name: Test generator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Test generator
        run: uv run --no-project --python 3.11 python -m unittest discover -s tests -v
      - name: Check generated project
        shell: bash
        run: |
          project_dir="$RUNNER_TEMP/typed example"
          ./pytyped.sh "$project_dir" --name typed-example --yes --python 3.14
          cd "$project_dir"
          make install check run build
          git init
          make install
          git add .
          uv run pre-commit run --all-files
